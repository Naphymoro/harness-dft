[project]
name = "harness-dft-mcp"
version = "0.1.0"
description = "MCP server exposing harness-dft (QE + AiiDA + ASE resource-adaptive DFT) to agent harnesses such as DeerFlow"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2,<2",
  "harness-dft",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness-dft-mcp = "harness_dft_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness_dft_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
